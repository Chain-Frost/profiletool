name: QGIS 3.44 compatibility

on:
  workflow_dispatch:
  push:
    branches: ["fix/profile-correctness-reliability"]
    paths:
      - ".github/workflows/qgis-3.44.yml"
      - "__init__.py"
      - "profileplugin.py"
      - "tools/**"
      - "ui/**"
      - "tests/test_qgis_layer_lifecycle.py"
      - "docs/qgis-3.44-compatibility.md"
      - "pyqtgraph/graphicsItems/**"
  pull_request:
    paths:
      - ".github/workflows/qgis-3.44.yml"
      - "__init__.py"
      - "profileplugin.py"
      - "tools/**"
      - "ui/**"
      - "tests/test_qgis_layer_lifecycle.py"
      - "docs/qgis-3.44-compatibility.md"
      - "pyqtgraph/graphicsItems/**"

jobs:
  qgis-344-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run actual PyQGIS lifecycle regressions in QGIS 3.44
        run: |
          docker run --rm --entrypoint /bin/bash \
            -e QT_QPA_PLATFORM=offscreen \
            -e QGIS_PREFIX_PATH=/usr \
            -e PYTHONPATH=/tests_directory:/usr/share/qgis/python \
            -v "${GITHUB_WORKSPACE}:/tests_directory/profiletool" \
            qgis/qgis:3.44.15-noble -euc '
              python3 -c "from qgis.core import Qgis; from qgis.PyQt.QtCore import QT_VERSION_STR, PYQT_VERSION_STR; from profiletool import pyqtgraph as pg; print(Qgis.QGIS_VERSION, QT_VERSION_STR, PYQT_VERSION_STR, pg.__version__)"
              python3 -m pytest -s -q /tests_directory/profiletool/tests/test_qgis_layer_lifecycle.py
            '
