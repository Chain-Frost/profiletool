name: Profile Tool quality

on:
  push:
    branches: [master, "fix/**", "feat/**"]
  pull_request:

jobs:
  syntax-and-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install numpy pytest ruff==0.16.6 "pyright>=1.1.410"
      - name: Ruff baseline (plugin-owned files only)
        run: |
          ruff check --isolated --target-version py39 --select E,F,I,UP,B --ignore E501 \
            __init__.py profileplugin.py \
            tools/profilers.py tools/dataReaderTool.py tools/selectlinetool.py tools/utils.py \
            tools/ptmaptool.py tools/tableviewtool.py ui/dlgabout.py \
            scripts/write_qgis_env.py scripts/qgis_dev.py scripts/setup_qgis_typing.py \
            tests/test_qgis_layer_lifecycle.py
      - name: Pyright next-scope audit (informational)
        continue-on-error: true
        run: |
          python -c "import json; p=json.load(open('pyright-ci.json')); p['include'].append('scripts/setup_qgis_typing.py'); open('pyright-audit.json','w').write(json.dumps(p))"
          pyright --project pyright-audit.json
      - name: Pyright baseline (QGIS-independent modules)
        run: pyright --project pyright-ci.json
      - name: Compile plugin sources
        run: python -m compileall -q __init__.py profileplugin.py tools ui
      - name: Regression tests (no QGIS desktop)
        run: python -m pytest -q tests/test_profile_regressions.py
