name: Internal upstream stack preflight

on:
  push:
    branches: [test/upstream-stack-preflight]
  pull_request:
    paths: [".github/workflows/upstream-stack-preflight.yml"]

permissions:
  contents: read

jobs:
  intermediate-heads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned commits, ZIPs and isolated deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stack-preflight"
          while read -r version sha; do
            git merge-base --is-ancestor "$sha" 645047d80f6fd31fd0526a2e063f400775259191
            root="$RUNNER_TEMP/stack-preflight/$version"
            mkdir -p "$root/profiletool" "$root/installed"
            git archive "$sha" | tar -x -C "$root/profiletool"
            cd "$root/profiletool"
            echo "::group::$version ($sha) package"
            grep -Fx "version=$version" metadata.txt
            grep -F "    $version :" metadata.txt
            make zip
            python3 - "$version" <<'PY'
          import configparser
          import hashlib
          import sys
          import zipfile
          from pathlib import Path

          archive = Path("profiletool.zip")
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              assert all(n.startswith("profiletool/") for n in names)
              assert not any(n.startswith(("profiletool/.github/", "profiletool/tests/", "profiletool/apicompat/")) for n in names)
              assert len(names) == len(set(names))
              assert z.testzip() is None
              for path in ("__init__.py", "metadata.txt", "LICENSE", "resources.py", "profileplugin.py"):
                  assert "profiletool/" + path in names
              metadata = configparser.ConfigParser(interpolation=None)
              metadata.read_string(z.read("profiletool/metadata.txt").decode())
              assert metadata["general"]["version"] == sys.argv[1]
              z.extractall("../installed")
          print("ZIP SHA-256:", hashlib.sha256(archive.read_bytes()).hexdigest())
          PY
            make deploy QGIS_PLUGIN_DIR="$root/deployed"
            diff -qr "$root/installed/profiletool" "$root/deployed/profiletool"
            echo "::endgroup::"
            cd "$GITHUB_WORKSPACE"
          done <<'VERSIONS'
          4.3.5 b0f426d38fa65b3519bd869d7cb1c11f9fb60dc1
          4.3.6 8818b7311afed35132538b7b68c20525f83b2214
          4.3.7 ac629f0ff3e7080af1e225a9b977996dc29f12cd
          4.3.8 73cd9e8650644aecea317171c7b9999d49745579
          VERSIONS
      - name: Native QGIS 3.44 smoke and applicable regressions
        shell: bash
        run: |
          docker run --rm --entrypoint /bin/bash \
            -e QT_QPA_PLATFORM=offscreen -e QGIS_PREFIX_PATH=/usr \
            -v "$RUNNER_TEMP/stack-preflight:/validation" \
            qgis/qgis:3.44.15-noble -euc '
              python3 -c "from qgis.core import Qgis; from qgis.PyQt.QtCore import QT_VERSION_STR, PYQT_VERSION_STR; print(Qgis.QGIS_VERSION, QT_VERSION_STR, PYQT_VERSION_STR)"
              for version in 4.3.5 4.3.6 4.3.7 4.3.8; do
                root="/validation/$version"
                echo "::group::$version installed ZIP activation"
                cd "$root/installed"
                PYTHONPATH="$root/installed:/usr/share/qgis/python" python3 -c "from qgis.testing import start_app; from qgis.testing.mocked import get_iface; from profiletool import classFactory; app=start_app(); plugin=classFactory(get_iface()); plugin.initGui(); plugin.unload(); print(\"Plugin factory/initGui/unload passed\")"
                echo "::endgroup::"
                cd "$root/profiletool"
                export PYTHONPATH="$root:/usr/share/qgis/python"
                echo "::group::$version headless regressions"
                pure=()
                for f in tests/test_profile_regressions.py tests/test_ui_typing_contract.py tests/test_csv_export.py; do
                  if test -f "$f"; then pure+=("$f"); fi
                done
                if (( ${#pure[@]} )); then python3 -m pytest -q "${pure[@]}"; else echo "No stage-specific headless regressions yet"; fi
                echo "::endgroup::"
                echo "::group::$version native graphics/lifecycle regressions"
                native=()
                for f in tests/test_qgis_graphics.py tests/test_qgis_layer_lifecycle.py; do
                  if test -f "$f"; then native+=("$f"); fi
                done
                if (( ${#native[@]} )); then python3 -m pytest -s -q "${native[@]}"; else echo "No stage-specific native regressions yet"; fi
                echo "::endgroup::"
              done
            '
